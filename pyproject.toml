[project]
name = "frames-extractor"
version = "0.1.0"
description = "Extracts video frames from an input video."
readme = "README.md"
authors = [
    { name = "memothelemo", email = "dev@memothelemo.xyz" }
]
requires-python = ">=3.12"
dependencies = [
    "opencv-contrib-python>=5.0.0.93",
]

[project.scripts]
frames_extractor = "frames_extractor:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
