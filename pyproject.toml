[project]
name = "jpg-to-png"
version = "0.1.0"
description = "Converts JPG image to PNG image"
readme = "README.md"
authors = [
    { name = "memothelemo", email = "dev@memothelemo.xyz" }
]
requires-python = ">=3.12"
dependencies = [
    "opencv-contrib-python>=5.0.0.93",
]

[project.scripts]
jpg_to_png = "jpg_to_png:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
