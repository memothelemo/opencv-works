[project]
name = "webcam-viewer"
version = "0.1.0"
description = "Loads, displays, and saves video from a webcam"
readme = "README.md"
authors = [
    { name = "memothelemo", email = "dev@memothelemo.xyz" }
]
requires-python = ">=3.12"
dependencies = [
    "opencv-contrib-python>=5.0.0.93",
]

[project.scripts]
webcam_viewer = "webcam_viewer:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
